<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital & Analog Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="clock-container">
        <div class="digital-clock-container">
            <div id="digital-clock" class="digital-clock"></div>
            <div class="time-format-toggle" id="time-format-toggle" title="Toggle 12/24 hour format">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
            </div>
        </div>
        <div id="analog-clock" class="analog-clock">
            <div class="hour-numbers"></div>
            <div class="tick-marks"></div>
            <div class="hour-hand"></div>
            <div class="minute-hand"></div>
            <div class="second-hand"></div>
            <div class="center-dot"></div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
